# Desarrollo local (OrbStack / Mac M1 ARM64) — hot reload, sin build de producción.
# Uso: docker compose up --build
#
# Producción (TrueNAS AMD64): ver docker-compose.prod.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: adobos-postgres-dev
    environment:
      POSTGRES_USER: adobos
      POSTGRES_PASSWORD: adobos
      POSTGRES_DB: adobos
    ports:
      - "5432:5432"
    volumes:
      - adobos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adobos -d adobos"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  adobos-bot:
    build:
      context: .
      dockerfile: Dockerfile.dev
    platform: linux/arm64
    image: adobos-bot:dev
    container_name: adobos-bot-dev
    ports:
      - "3000:3000"
      - "4321:4321"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://adobos:adobos@postgres:5432/adobos
      DATA_DIR: /data
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - ./data:/data
      - adobos_node_modules:/app/node_modules
      - adobos_backend_modules:/app/backend/node_modules
      - adobos_frontend_modules:/app/frontend/node_modules
      - adobos_shared_modules:/app/packages/shared/node_modules
      - adobos_pnpm_store:/app/.pnpm-store
    working_dir: /app
    command: sh -c "pnpm install && pnpm dev"
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  adobos_node_modules:
  adobos_backend_modules:
  adobos_frontend_modules:
  adobos_shared_modules:
  adobos_pnpm_store:
  adobos_pgdata:
