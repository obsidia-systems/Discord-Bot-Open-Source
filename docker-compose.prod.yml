# Producción All-in-One (TrueNAS AMD64 / imagen multi-etapa).
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
# Cross-compile desde Mac ARM64:
#   docker buildx build --platform linux/amd64 -t adobos-bot --load .

services:
  adobos-bot:
    build:
      context: .
      dockerfile: Dockerfile
      # platforms:
      #   - linux/amd64
    image: adobos-bot:latest
    container_name: adobos-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: file:/data/database.sqlite
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
