# Producción All-in-One (TrueNAS AMD64 / imagen multi-etapa).
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
# Cross-compile desde Mac ARM64:
#   docker buildx build --platform linux/amd64 -t adobos-bot --load .

services:
  postgres:
    image: postgres:16-alpine
    container_name: adobos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adobos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adobos}
      POSTGRES_DB: adobos
    volumes:
      - adobos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adobos -d adobos"]
      interval: 10s
      timeout: 5s
      retries: 10

  adobos-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: adobos-bot:latest
    container_name: adobos-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://adobos:${POSTGRES_PASSWORD:-adobos}@postgres:5432/adobos
      DATA_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  adobos_pgdata:
