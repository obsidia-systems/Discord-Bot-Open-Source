# Producción — postgres (interno) + backend (API + bot) + frontend (nginx).
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Un solo puerto público: el panel (nginx) en 3000. Postgres y la API
# no se publican; nginx proxifica /api, /auth y /uploads.
#
# PUBLIC_APP_URL y CORS_ORIGIN deben ser la URL que ve el navegador
# (p. ej. http://tu-host:3000).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adobos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: adobos
    volumes:
      - adobos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adobos -d adobos"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - adobos
    # Sin ports: sólo la red interna de Compose.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - adobos_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - adobos

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: adobos-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      SERVE_STATIC: "false"
      DATABASE_URL: postgresql://adobos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/adobos
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      NODE_OPTIONS: --dns-result-order=ipv4first
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    stop_grace_period: 20s
    expose:
      - "3000"
    networks:
      - adobos

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: adobos-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - adobos

volumes:
  adobos_pgdata:
  adobos_redisdata:

networks:
  adobos:
    driver: bridge
