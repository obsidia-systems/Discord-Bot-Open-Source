name: Tobot

on:
  push:
    paths:
      - "tobot/**"
      - ".github/workflows/tobot.yml"
  pull_request:
    paths:
      - "tobot/**"
      - ".github/workflows/tobot.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tobot
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tobot
          POSTGRES_PASSWORD: development-only
          POSTGRES_DB: tobot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tobot -d tobot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TOBOT_TEST_DATABASE_URL: postgres://tobot:development-only@localhost:5432/tobot_test
      TOBOT_REQUIRE_POSTGRES: "1"
      TOBOT_TEST_REDIS_URL: redis://localhost:6379/1
      TOBOT_REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all -- --check
      - name: test
        run: cargo test --workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tobot
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tobot/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: shell tests
        run: pnpm --filter @tobot/dash test && pnpm --filter @tobot/admin test
      - name: astro check
        run: pnpm --filter @tobot/dash check && pnpm --filter @tobot/admin check
