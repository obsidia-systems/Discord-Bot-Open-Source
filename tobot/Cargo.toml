[workspace]
members = [
  "bins/control-plane",
  "bins/delivery",
  "bins/discord-edge",
  "bins/migrate",
  "crates/tobot-config",
  "crates/tobot-discord-adapter",
  "crates/tobot-delivery-client",
  "crates/tobot-bus",
  "crates/tobot-core",
  "crates/tobot-envelope",
  "crates/tobot-identity",
  "crates/tobot-identity-service",
  "crates/tobot-interaction-edge",
  "crates/tobot-outbox",
  "crates/tobot-persistence",
  "crates/tobot-secret-store",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
http = "1.3"
rand = "0.9"
redis = { version = "1.5", default-features = false, features = ["streams", "tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls", "time", "uuid"] }
subtle = "2.6"
time = { version = "0.3", features = ["formatting"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["request-id", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
twilight-http = { version = "0.17.1", default-features = false, features = ["rustls-webpki-roots"] }
twilight-gateway = "0.17.1"
twilight-model = "0.17.1"
uuid = { version = "1.18", features = ["serde", "v4", "v7"] }
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
