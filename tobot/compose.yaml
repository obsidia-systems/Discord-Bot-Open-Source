services:
  vault:
    image: hashicorp/vault:1.21
    command: ["server", "-dev", "-dev-root-token-id=${TOBOT_VAULT_DEV_ROOT_TOKEN:?set TOBOT_VAULT_DEV_ROOT_TOKEN}"]
    environment:
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: [IPC_LOCK]
    networks: [secrets]

  vault-init:
    image: hashicorp/vault:1.21
    entrypoint: []
    command:
      - /bin/sh
      - -ec
      - >-
        export VAULT_ADDR=http://vault:8200;
        export VAULT_TOKEN=$${TOBOT_VAULT_DEV_ROOT_TOKEN};
        until vault status >/dev/null 2>&1; do sleep 1; done;
        vault secrets enable -path=tobot-transit transit 2>/dev/null || true;
        vault write -f tobot-transit/keys/tobot-oauth >/dev/null
    environment:
      TOBOT_VAULT_DEV_ROOT_TOKEN: ${TOBOT_VAULT_DEV_ROOT_TOKEN:?set TOBOT_VAULT_DEV_ROOT_TOKEN}
    depends_on: [vault]
    networks: [secrets]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tobot
      POSTGRES_PASSWORD: development-only
      POSTGRES_DB: tobot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tobot -d tobot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  postgres-ledger:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tobot_ledger
      POSTGRES_PASSWORD: ${TOBOT_LEDGER_DB_PASSWORD:?set TOBOT_LEDGER_DB_PASSWORD}
      POSTGRES_DB: tobot_ledger
    volumes: [ledger_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tobot_ledger -d tobot_ledger"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  postgres-provider-edge:
    profiles: [billing]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tobot_provider_edge
      POSTGRES_PASSWORD: ${TOBOT_PROVIDER_EDGE_DB_PASSWORD:-}
      POSTGRES_DB: tobot_provider_edge
    volumes: [provider_edge_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tobot_provider_edge -d tobot_provider_edge"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  postgres-billing:
    profiles: [billing]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tobot_billing
      POSTGRES_PASSWORD: ${TOBOT_BILLING_DB_PASSWORD:-}
      POSTGRES_DB: tobot_billing
    volumes: [billing_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tobot_billing -d tobot_billing"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  provider-event-edge:
    profiles: [billing]
    build: .
    command: ["/usr/local/bin/tobot-provider-event-edge"]
    environment:
      TOBOT_PROVIDER_EDGE_DATABASE_URL: postgres://tobot_provider_edge:${TOBOT_PROVIDER_EDGE_DB_PASSWORD:-}@postgres-provider-edge:5432/tobot_provider_edge
      TOBOT_STRIPE_TEST_WEBHOOK_SECRET: ${TOBOT_STRIPE_TEST_WEBHOOK_SECRET:-}
      TOBOT_STRIPE_TEST_ACCOUNT_SCOPE: ${TOBOT_STRIPE_TEST_ACCOUNT_SCOPE:-}
      TOBOT_PROVIDER_TO_BILLING_TOKEN: ${TOBOT_PROVIDER_TO_BILLING_TOKEN:-}
      TOBOT_BILLING_URL: http://billing:8087
      TOBOT_PROVIDER_EDGE_BIND: 0.0.0.0:8086
    depends_on:
      postgres-provider-edge:
        condition: service_healthy
    networks: [data, public]

  stripe-listener:
    profiles: [billing-dev]
    image: stripe/stripe-cli:v1.51.1
    logging:
      driver: none
    command:
      - listen
      - --forward-to
      - http://provider-event-edge:8086/webhooks/stripe/1
      - --events
      - checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired,invoice.paid,invoice.payment_failed,customer.subscription.updated,customer.subscription.deleted,customer.subscription.paused,refund.created,refund.updated,refund.failed,charge.dispute.created,charge.dispute.updated,charge.dispute.closed
    environment:
      STRIPE_API_KEY: ${TOBOT_STRIPE_TEST_API_KEY:-}
      STRIPE_DEVICE_NAME: tobot-compose-test
    depends_on:
      provider-event-edge:
        condition: service_started
    networks: [data, provider]

  billing:
    profiles: [billing]
    build: .
    command: ["/usr/local/bin/tobot-billing"]
    environment:
      TOBOT_BILLING_DATABASE_URL: postgres://tobot_billing:${TOBOT_BILLING_DB_PASSWORD:-}@postgres-billing:5432/tobot_billing
      TOBOT_STRIPE_TEST_API_KEY: ${TOBOT_STRIPE_TEST_API_KEY:-}
      TOBOT_STRIPE_TEST_ACCOUNT_SCOPE: ${TOBOT_STRIPE_TEST_ACCOUNT_SCOPE:-}
      TOBOT_BILLING_COMMAND_TOKEN: ${TOBOT_BILLING_COMMAND_TOKEN:-}
      TOBOT_PROVIDER_TO_BILLING_TOKEN: ${TOBOT_PROVIDER_TO_BILLING_TOKEN:-}
      TOBOT_BILLING_TO_CONTROL_TOKEN: ${TOBOT_BILLING_TO_CONTROL_TOKEN:-}
      TOBOT_PUBLIC_APP_ORIGIN: ${TOBOT_PUBLIC_APP_ORIGIN:?set TOBOT_PUBLIC_APP_ORIGIN}
      TOBOT_CONTROL_URL: http://control-plane:8080
      TOBOT_BILLING_BIND: 0.0.0.0:8087
    depends_on:
      postgres-billing:
        condition: service_healthy
    networks: [data, provider]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  migrate:
    build: .
    command: ["/usr/local/bin/tobot-migrate"]
    environment:
      TOBOT_DATABASE_URL: ${TOBOT_DATABASE_URL:?set TOBOT_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  ledger-migrate:
    build: .
    command: ["/usr/local/bin/tobot-monetary-ledger", "--migrate"]
    environment:
      TOBOT_LEDGER_DATABASE_URL: postgres://tobot_ledger:${TOBOT_LEDGER_DB_PASSWORD:?set TOBOT_LEDGER_DB_PASSWORD}@postgres-ledger:5432/tobot_ledger
      TOBOT_LEDGER_SERVICE_TOKEN: ${TOBOT_LEDGER_SERVICE_TOKEN:?set TOBOT_LEDGER_SERVICE_TOKEN}
      TOBOT_LEDGER_RECEIPT_KEY: ${TOBOT_LEDGER_RECEIPT_KEY:?set TOBOT_LEDGER_RECEIPT_KEY}
      TOBOT_BILLING_URL: http://billing:8087
      TOBOT_BILLING_COMMAND_TOKEN: ${TOBOT_BILLING_COMMAND_TOKEN:-}
      TOBOT_BILLING_TO_CONTROL_TOKEN: ${TOBOT_BILLING_TO_CONTROL_TOKEN:-}
    depends_on:
      postgres-ledger:
        condition: service_healthy
    networks: [data]

  postgres-ai:
    profiles: [ai]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tobot_ai
      POSTGRES_PASSWORD: ${TOBOT_AI_DB_PASSWORD:-}
      POSTGRES_DB: tobot_ai
    volumes: [ai_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tobot_ai -d tobot_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  ai-migrate:
    profiles: [ai]
    build: .
    command: ["/usr/local/bin/tobot-ai", "--migrate"]
    environment:
      TOBOT_AI_DATABASE_URL: postgres://tobot_ai:${TOBOT_AI_DB_PASSWORD:-}@postgres-ai:5432/tobot_ai
    depends_on:
      postgres-ai:
        condition: service_healthy
    networks: [data]

  ai:
    profiles: [ai]
    build: .
    command: ["/usr/local/bin/tobot-ai"]
    environment:
      TOBOT_AI_DATABASE_URL: postgres://tobot_ai:${TOBOT_AI_DB_PASSWORD:-}@postgres-ai:5432/tobot_ai
      TOBOT_AI_SERVICE_TOKEN: ${TOBOT_AI_SERVICE_TOKEN:-}
      TOBOT_AI_RECEIPT_KEY: ${TOBOT_AI_RECEIPT_KEY:-}
      TOBOT_AI_SECRET_KEY: ${TOBOT_AI_SECRET_KEY:-}
      TOBOT_AI_BIND: 0.0.0.0:8088
      TOBOT_DISCORD_APPLICATION_ID: ${TOBOT_DISCORD_APPLICATION_ID:?set TOBOT_DISCORD_APPLICATION_ID}
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
    networks: [data, provider]

  monetary-ledger:
    build: .
    command: ["/usr/local/bin/tobot-monetary-ledger"]
    environment:
      TOBOT_LEDGER_DATABASE_URL: postgres://tobot_ledger:${TOBOT_LEDGER_DB_PASSWORD:?set TOBOT_LEDGER_DB_PASSWORD}@postgres-ledger:5432/tobot_ledger
      TOBOT_LEDGER_SERVICE_TOKEN: ${TOBOT_LEDGER_SERVICE_TOKEN:?set TOBOT_LEDGER_SERVICE_TOKEN}
      TOBOT_LEDGER_RECEIPT_KEY: ${TOBOT_LEDGER_RECEIPT_KEY:?set TOBOT_LEDGER_RECEIPT_KEY}
      TOBOT_DISCORD_APPLICATION_ID: ${TOBOT_DISCORD_APPLICATION_ID:?set TOBOT_DISCORD_APPLICATION_ID}
      TOBOT_REDIS_URL: ${TOBOT_REDIS_URL:?set TOBOT_REDIS_URL}
      TOBOT_LEDGER_BIND: 0.0.0.0:8085
    depends_on:
      ledger-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [data]

  control-plane:
    build: .
    command: ["/usr/local/bin/tobot-control-plane"]
    environment:
      TOBOT_CONTROL_BIND: ${TOBOT_CONTROL_BIND:-0.0.0.0:8080}
      TOBOT_PUBLIC_APP_ORIGIN: ${TOBOT_PUBLIC_APP_ORIGIN:?set TOBOT_PUBLIC_APP_ORIGIN}
      TOBOT_DISCORD_OAUTH_REDIRECT_URI: ${TOBOT_DISCORD_OAUTH_REDIRECT_URI:?set TOBOT_DISCORD_OAUTH_REDIRECT_URI}
      TOBOT_DISCORD_INSTALL_REDIRECT_URI: ${TOBOT_DISCORD_INSTALL_REDIRECT_URI:?set TOBOT_DISCORD_INSTALL_REDIRECT_URI}
      TOBOT_DATABASE_URL: ${TOBOT_DATABASE_URL:?set TOBOT_DATABASE_URL}
      TOBOT_REDIS_URL: ${TOBOT_REDIS_URL:?set TOBOT_REDIS_URL}
      TOBOT_DISCORD_APPLICATION_ID: ${TOBOT_DISCORD_APPLICATION_ID:?set TOBOT_DISCORD_APPLICATION_ID}
      TOBOT_DISCORD_CLIENT_ID: ${TOBOT_DISCORD_CLIENT_ID:?set TOBOT_DISCORD_CLIENT_ID}
      TOBOT_DISCORD_CLIENT_SECRET: ${TOBOT_DISCORD_CLIENT_SECRET:?set TOBOT_DISCORD_CLIENT_SECRET}
      TOBOT_VAULT_ADDR: ${TOBOT_VAULT_ADDR:-http://vault:8200}
      TOBOT_VAULT_TOKEN: ${TOBOT_VAULT_TOKEN:?set TOBOT_VAULT_TOKEN}
      TOBOT_VAULT_TRANSIT_KEY: ${TOBOT_VAULT_TRANSIT_KEY:-tobot-oauth}
      TOBOT_DELIVERY_URL: ${TOBOT_DELIVERY_URL:-http://delivery:8081}
      TOBOT_INTERNAL_SERVICE_TOKEN: ${TOBOT_INTERNAL_SERVICE_TOKEN:?set TOBOT_INTERNAL_SERVICE_TOKEN}
      TOBOT_LEDGER_URL: http://monetary-ledger:8085
      TOBOT_LEDGER_SERVICE_TOKEN: ${TOBOT_LEDGER_SERVICE_TOKEN:?set TOBOT_LEDGER_SERVICE_TOKEN}
      TOBOT_LEDGER_RECEIPT_KEY: ${TOBOT_LEDGER_RECEIPT_KEY:?set TOBOT_LEDGER_RECEIPT_KEY}
      TOBOT_CONTROL_METRICS_BIND: 0.0.0.0:8083
      TOBOT_BILLING_URL: http://billing:8087
      TOBOT_BILLING_COMMAND_TOKEN: ${TOBOT_BILLING_COMMAND_TOKEN:-}
      TOBOT_BILLING_TO_CONTROL_TOKEN: ${TOBOT_BILLING_TO_CONTROL_TOKEN:-}
      TOBOT_CATALOG_ADMIN_TOKEN: ${TOBOT_CATALOG_ADMIN_TOKEN:-}
      TOBOT_AI_URL: http://ai:8088
      TOBOT_AI_SERVICE_TOKEN: ${TOBOT_AI_SERVICE_TOKEN:-}
      TOBOT_AI_RECEIPT_KEY: ${TOBOT_AI_RECEIPT_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      monetary-ledger:
        condition: service_started
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    networks: [data, public, secrets, edge_delivery]

  discord-edge:
    build: .
    command: ["/usr/local/bin/tobot-discord-edge"]
    environment:
      TOBOT_DATABASE_URL: ${TOBOT_DATABASE_URL:?set TOBOT_DATABASE_URL}
      TOBOT_DISCORD_APPLICATION_ID: ${TOBOT_DISCORD_APPLICATION_ID:?set TOBOT_DISCORD_APPLICATION_ID}
      TOBOT_DISCORD_BOT_TOKEN: ${TOBOT_DISCORD_BOT_TOKEN:?set TOBOT_DISCORD_BOT_TOKEN}
      TOBOT_DELIVERY_URL: ${TOBOT_DELIVERY_URL:-http://delivery:8081}
      TOBOT_CONTROL_URL: ${TOBOT_CONTROL_URL:-http://control-plane:8080}
      TOBOT_INTERNAL_SERVICE_TOKEN: ${TOBOT_INTERNAL_SERVICE_TOKEN:?set TOBOT_INTERNAL_SERVICE_TOKEN}
      TOBOT_EDGE_HEALTH_BIND: 0.0.0.0:8082
      TOBOT_GUILD_MEMBERS_INTENT_CONFIRMED: ${TOBOT_GUILD_MEMBERS_INTENT_CONFIRMED:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data, edge_delivery, provider]

  delivery:
    build: .
    command: ["/usr/local/bin/tobot-delivery"]
    environment:
      TOBOT_DATABASE_URL: ${TOBOT_DATABASE_URL:?set TOBOT_DATABASE_URL}
      TOBOT_REDIS_URL: ${TOBOT_REDIS_URL:?set TOBOT_REDIS_URL}
      TOBOT_DISCORD_BOT_TOKEN: ${TOBOT_DISCORD_BOT_TOKEN:?set TOBOT_DISCORD_BOT_TOKEN}
      TOBOT_INTERNAL_SERVICE_TOKEN: ${TOBOT_INTERNAL_SERVICE_TOKEN:?set TOBOT_INTERNAL_SERVICE_TOKEN}
      TOBOT_DELIVERY_BIND: 0.0.0.0:8081
      TOBOT_DELIVERY_METRICS_BIND: 0.0.0.0:8084
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [data, edge_delivery, provider]

  dash:
    image: node:26-bookworm-slim
    working_dir: /workspace
    command: sh -c "rm -f apps/dash/.astro/dev.json && npm install -g pnpm@12 && pnpm install --frozen-lockfile && pnpm --filter @tobot/dash dev --host 0.0.0.0"
    volumes: [".:/workspace"]
    networks: [public]

  www:
    image: node:26-bookworm-slim
    working_dir: /workspace
    command: sh -c "rm -f apps/www/.astro/dev.json && npm install -g pnpm@12 && pnpm install --frozen-lockfile && pnpm --filter @tobot/www dev --host 0.0.0.0"
    volumes: [".:/workspace"]
    networks: [public]

  docs:
    image: node:26-bookworm-slim
    working_dir: /workspace
    command: sh -c "rm -f apps/docs/.astro/dev.json && npm install -g pnpm@12 && pnpm install --frozen-lockfile && pnpm --filter @tobot/docs dev --host 0.0.0.0"
    volumes: [".:/workspace"]
    networks: [public]

  admin:
    image: node:26-bookworm-slim
    working_dir: /workspace
    command: sh -c "rm -f apps/admin/.astro/dev.json && npm install -g pnpm@12 && pnpm install --frozen-lockfile && pnpm --filter @tobot/admin dev --host 0.0.0.0"
    environment:
      NODE_ENV: development
      TOBOT_ADMIN_VITE_CACHE_DIR: /tmp/tobot-admin-vite
      TOBOT_INTERNAL_SERVICE_TOKEN: ${TOBOT_INTERNAL_SERVICE_TOKEN:?set TOBOT_INTERNAL_SERVICE_TOKEN}
      TOBOT_ADMIN_OPERATOR_TOKEN: ${TOBOT_ADMIN_OPERATOR_TOKEN:?set TOBOT_ADMIN_OPERATOR_TOKEN}
      TOBOT_CATALOG_ADMIN_TOKEN: ${TOBOT_CATALOG_ADMIN_TOKEN:?set TOBOT_CATALOG_ADMIN_TOKEN}
      TOBOT_STRIPE_TEST_ACCOUNT_SCOPE: ${TOBOT_STRIPE_TEST_ACCOUNT_SCOPE:-}
      TOBOT_CONTROL_URL: http://control-plane:8080
      TOBOT_CONTROL_METRICS_URL: http://control-plane:8083
      TOBOT_DELIVERY_URL: http://delivery:8081
      TOBOT_DELIVERY_METRICS_URL: http://delivery:8084
      TOBOT_EDGE_URL: http://discord-edge:8082
    volumes: [".:/workspace"]
    networks: [public, edge_delivery]

  caddy:
    image: caddy:2-alpine
    ports: ["443:443"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [dash, www, docs, admin, control-plane]
    networks: [public]

volumes:
  caddy_data:
  ledger_pgdata:
  provider_edge_pgdata:
  billing_pgdata:
  ai_pgdata:

networks:
  data:
    internal: true
  edge_delivery:
    internal: true
  provider: {}
  public: {}
  secrets:
    internal: true
