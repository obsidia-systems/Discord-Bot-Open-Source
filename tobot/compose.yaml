services:
  vault:
    image: hashicorp/vault:1.21
    command: ["server", "-dev", "-dev-root-token-id=${TOBOT_VAULT_DEV_ROOT_TOKEN:?set TOBOT_VAULT_DEV_ROOT_TOKEN}"]
    environment:
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: [IPC_LOCK]
    networks: [secrets]

  vault-init:
    image: hashicorp/vault:1.21
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      export VAULT_ADDR=http://vault:8200;
      export VAULT_TOKEN=$${TOBOT_VAULT_DEV_ROOT_TOKEN};
      until vault status >/dev/null 2>&1; do sleep 1; done;
      vault secrets enable -path=tobot-transit transit 2>/dev/null || true;
      vault write -f tobot-transit/keys/tobot-oauth >/dev/null
    environment:
      TOBOT_VAULT_DEV_ROOT_TOKEN: ${TOBOT_VAULT_DEV_ROOT_TOKEN:?set TOBOT_VAULT_DEV_ROOT_TOKEN}
    depends_on: [vault]
    networks: [secrets]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tobot
      POSTGRES_PASSWORD: development-only
      POSTGRES_DB: tobot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tobot -d tobot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  migrate:
    build: .
    command: ["/usr/local/bin/tobot-migrate"]
    environment:
      TOBOT_DATABASE_URL: ${TOBOT_DATABASE_URL:?set TOBOT_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  control-plane:
    build: .
    command: ["/usr/local/bin/tobot-control-plane"]
    environment:
      TOBOT_CONTROL_BIND: ${TOBOT_CONTROL_BIND:-0.0.0.0:8080}
      TOBOT_PUBLIC_APP_ORIGIN: ${TOBOT_PUBLIC_APP_ORIGIN:?set TOBOT_PUBLIC_APP_ORIGIN}
      TOBOT_DISCORD_OAUTH_REDIRECT_URI: ${TOBOT_DISCORD_OAUTH_REDIRECT_URI:?set TOBOT_DISCORD_OAUTH_REDIRECT_URI}
      TOBOT_DATABASE_URL: ${TOBOT_DATABASE_URL:?set TOBOT_DATABASE_URL}
      TOBOT_REDIS_URL: ${TOBOT_REDIS_URL:?set TOBOT_REDIS_URL}
      TOBOT_DISCORD_APPLICATION_ID: ${TOBOT_DISCORD_APPLICATION_ID:?set TOBOT_DISCORD_APPLICATION_ID}
      TOBOT_DISCORD_CLIENT_ID: ${TOBOT_DISCORD_CLIENT_ID:?set TOBOT_DISCORD_CLIENT_ID}
      TOBOT_DISCORD_CLIENT_SECRET: ${TOBOT_DISCORD_CLIENT_SECRET:?set TOBOT_DISCORD_CLIENT_SECRET}
      TOBOT_VAULT_ADDR: ${TOBOT_VAULT_ADDR:-http://vault:8200}
      TOBOT_VAULT_TOKEN: ${TOBOT_VAULT_TOKEN:?set TOBOT_VAULT_TOKEN}
      TOBOT_VAULT_TRANSIT_KEY: ${TOBOT_VAULT_TRANSIT_KEY:-tobot-oauth}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    networks: [data, public, secrets]

  discord-edge:
    build: .
    command: ["/usr/local/bin/tobot-discord-edge"]
    environment:
      TOBOT_DATABASE_URL: ${TOBOT_DATABASE_URL:?set TOBOT_DATABASE_URL}
      TOBOT_DISCORD_APPLICATION_ID: ${TOBOT_DISCORD_APPLICATION_ID:?set TOBOT_DISCORD_APPLICATION_ID}
      TOBOT_DISCORD_BOT_TOKEN: ${TOBOT_DISCORD_BOT_TOKEN:?set TOBOT_DISCORD_BOT_TOKEN}
      TOBOT_DELIVERY_URL: ${TOBOT_DELIVERY_URL:-http://delivery:8081}
      TOBOT_INTERNAL_SERVICE_TOKEN: ${TOBOT_INTERNAL_SERVICE_TOKEN:?set TOBOT_INTERNAL_SERVICE_TOKEN}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data, edge_delivery]

  delivery:
    build: .
    command: ["/usr/local/bin/tobot-delivery"]
    environment:
      TOBOT_DATABASE_URL: ${TOBOT_DATABASE_URL:?set TOBOT_DATABASE_URL}
      TOBOT_REDIS_URL: ${TOBOT_REDIS_URL:?set TOBOT_REDIS_URL}
      TOBOT_DISCORD_BOT_TOKEN: ${TOBOT_DISCORD_BOT_TOKEN:?set TOBOT_DISCORD_BOT_TOKEN}
      TOBOT_INTERNAL_SERVICE_TOKEN: ${TOBOT_INTERNAL_SERVICE_TOKEN:?set TOBOT_INTERNAL_SERVICE_TOKEN}
      TOBOT_DELIVERY_BIND: 0.0.0.0:8081
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [data, edge_delivery]

  app:
    image: node:26-bookworm-slim
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @tobot/app dev --host 0.0.0.0"
    volumes: [".:/workspace"]
    networks: [public]

  www:
    image: node:26-bookworm-slim
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @tobot/www dev --host 0.0.0.0"
    volumes: [".:/workspace"]
    networks: [public]

  docs:
    image: node:26-bookworm-slim
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @tobot/docs dev --host 0.0.0.0"
    volumes: [".:/workspace"]
    networks: [public]

  caddy:
    image: caddy:2-alpine
    ports: ["443:443"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app, www, docs, control-plane]
    networks: [public]

volumes:
  caddy_data:

networks:
  data:
    internal: true
  edge_delivery:
    internal: true
  public: {}
  secrets:
    internal: true
